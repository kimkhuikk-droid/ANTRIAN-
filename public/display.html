<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Display Antrian</title>
<style>
  body{font-family:system-ui;background:#111;color:#fff;margin:0;padding:20px;text-align:center}
  h1{font-size:60px;margin:0 0 20px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .card{background:#222;border-radius:20px;padding:20px}
  .kode{font-size:40px;color:#fbbf24}
  .nomor{font-size:120px;font-weight:bold;color:#10b981}
</style></head>
<body>
<h1>🏦 ANTRIAN</h1>
<div class="grid" id="grid"></div>
<script>
let lastNomor = {};
async function load(){
  const r = await fetch('/api/display'); const d = await r.json();
  const grid = document.getElementById('grid'); grid.innerHTML = '';
  d.layanan.forEach(l => {
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = <div class="kode">ANTRIAN ${l.kode}</div><div style="font-size:18px;color:#888">${l.nama}</div><div class="nomor">${l.dipanggil || '-'}</div>;
    grid.appendChild(c);
    if (lastNomor[l.kode] && l.dipanggil > lastNomor[l.kode]) {
      new Audio('https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg').play().catch(()=>{});
    }
    lastNomor[l.kode] = l.dipanggil;
  });
}
load(); setInterval(load, 3000);
</script>
</body>
</html>
