<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ambil Antrian</title>
<style>
  body{font-family:system-ui;background:#f5f5f5;margin:0;padding:16px;text-align:center}
  .card{background:#fff;border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 2px 8px #0001}
  .btn{padding:18px;font-size:22px;font-weight:bold;border:none;border-radius:12px;background:#2563eb;color:#fff;width:100%;margin:8px 0;cursor:pointer}
  .btn:disabled{background:#ccc}
  .nomor{font-size:80px;font-weight:bold;color:#2563eb;margin:10px 0}
  .label{font-size:14px;color:#666}
  .warn{background:#fee;color:#c00;padding:12px;border-radius:8px;font-size:13px;margin-top:12px}
  .panggil{font-size:28px;color:#059669;font-weight:bold}
</style>
</head>
<body>
<h2>Ambil Antrian</h2>
<div id="step1"><div id="layananList"></div></div>
<div id="step2" style="display:none">
  <div class="card">
    <div class="label">Antrian Anda</div>
    <div class="nomor" id="nomorSaya">-</div>
    <div class="label">Antrian sedang berjalan</div>
    <div class="panggil" id="sedangBerjalan">-</div>
    <div class="warn" id="peringatan">⚠️ Lewat dari 3 antrian, nomor tidak berlaku lagi</div>
  </div>
  <button class="btn" onclick="location.reload()">Ambil Antrian Baru</button>
</div>
<script>
const suara = new Audio('https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg');
async function loadLayanan(){
  const r = await fetch('/api/info'); const data = await r.json();
  const list = document.getElementById('layananList'); list.innerHTML = '';
  data.forEach(l => {
    const div = document.createElement('div'); div.className = 'card';
    const buka = l.status.buka;
    div.innerHTML = `
      <div style="font-size:24px;font-weight:bold">Antrian ${l.kode}</div>
      <div style="font-size:16px;color:#555;margin-bottom:8px">${l.nama}</div>
      <div class="label">Sedang dipanggil: <b>${l.sedang_dipanggil || '-'}</b> | Menunggu: ${l.sisa_menunggu}</div>
      <button class="btn" ${!buka || !l.aktif ? 'disabled' : ''} onclick="ambil('${l.kode}')">
        ${l.aktif ? (buka ? 'Ambil Nomor' : l.status.alasan) : 'Tidak Aktif'}
      </button>`;
    list.appendChild(div);
  });
}
async function ambil(kode){
  const r = await fetch('/api/ambil', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({kode})});
  const d = await r.json();
  if (d.error){ alert(d.error); return; }
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step2').style.display = 'block';
  document.getElementById('nomorSaya').textContent = kode + '-' + d.nomor_anda;
  document.getElementById('sedangBerjalan').textContent = kode + '-' + (d.sedang_berjalan || 0);
  mulaiPolling(kode, d.nomor_anda);
}
let pollId = null;
function mulaiPolling(kode, nomor){
  let lastStatus = '';
  if (pollId) clearInterval(pollId);
  pollId = setInterval(async () => {
    const r = await fetch(/api/status/${kode}/${nomor}); const d = await r.json();
    if (d.error) return;
    document.getElementById('sedangBerjalan').textContent = kode + '-' + d.sedang_berjalan;
    document.getElementById('peringatan').textContent = '⚠️ ' + d.pesan;
    if (d.status === 'dipanggil' && lastStatus !== 'dipanggil'){
      if (navigator.vibrate) navigator.vibrate([500,200,500,200,500]);
      suara.play().catch(()=>{});
      alert('🔔 NOMOR ANDA DIPANGGIL: ' + kode + '-' + nomor);
    }
    lastStatus = d.status;
  }, 3000);
}
loadLayanan();
</script>
</body>
</html>
